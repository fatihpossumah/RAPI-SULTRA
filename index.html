<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAPI-SULTRA — Intelligence Keuangan Berbasis AI</title>
  <meta name="description"
    content="Transformasi jejak transaksi UMKM menjadi catatan keuangan terstruktur dan Profil Kesiapan Pembiayaan RAPI berbasis AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <!-- Splash Screen Overlay -->
  <div id="splash-screen" class="splash-screen">
    <!-- Ambient & Grid Background -->
    <div class="splash-bg-ambient"></div>
    <div class="splash-bg-grid"></div>
    <div class="splash-bg-particles"></div>
    
    <div class="splash-content">
      <div class="splash-logo-wrapper">
        <img src="/logo-rapi.png" alt="RAPI-SULTRA Logo" class="splash-logo" />
        <div class="splash-logo-sweep"></div>
      </div>
      
      <h1 class="splash-title">RAPI-SULTRA</h1>
      <p class="splash-subtitle">Rekapitulasi Arus Pembayaran Integratif</p>
      
      <!-- Signature Data Flow Indicator -->
      <div class="splash-data-flow" aria-label="Loading">
        <div class="data-node"></div>
        <div class="data-line"><div class="data-pulse"></div></div>
        <div class="data-node"></div>
        <div class="data-line"><div class="data-pulse" style="animation-delay: 0.2s"></div></div>
        <div class="data-node"></div>
        <div class="data-line"><div class="data-pulse" style="animation-delay: 0.4s"></div></div>
        <div class="data-node"></div>
      </div>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon" id="logo-container">
            <img src="/logo-rapi.png" alt="RAPI-SULTRA Logo" class="brand-logo" />
          </div>
          <div class="logo-text">
            <h1>RAPI-SULTRA</h1>
            <p>Intelligence Keuangan Berbasis AI</p>
          </div>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="#overview" class="nav-item active" data-page="overview">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span>Ikhtisar</span>
        </a>
        <a href="#transactions" class="nav-item" data-page="transactions">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 4h14M3 8h14M3 12h10M3 16h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span>Transaksi</span>
        </a>
        <a href="#review" class="nav-item" data-page="review">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 2L12.5 7.5H18L13.5 11L15.5 17L10 13.5L4.5 17L6.5 11L2 7.5H7.5L10 2Z" stroke="currentColor"
              stroke-width="1.5" stroke-linejoin="round" />
          </svg>
          <span>Pusat Review</span>
          <span id="review-badge" class="nav-badge hidden">0</span>
        </a>
        <a href="#financial" class="nav-item" data-page="financial">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M2 17V8l4-3 4 3 4-5 4 5v12H2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
          <span>Profil Keuangan</span>
        </a>
        <a href="#rapi" class="nav-item" data-page="rapi">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M10 5v5l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span>Profil RAPI</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="simulation-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M19 11H5M19 11C20.1046 11 21 11.8954 21 13V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V13C3 11.8954 3.89543 11 5 11M19 11V9C19 7.89543 18.1046 7 17 7M5 11V9C5 7.89543 5.89543 7 7 7M7 7V5C7 3.89543 7.89543 3 9 3H15C16.1046 3 17 3.89543 17 5V7M7 7H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div>
            <span class="sim-label">Demo UMKM</span>
            <span class="sim-sub">Mode Simulasi</span>
          </div>
        </div>
      </div>
    </aside>
    <main id="main-content" class="main-content">
      <!-- Pages rendered here -->
    </main>
    <div id="drawer-overlay" class="drawer-overlay hidden"></div>
    <div id="drawer" class="drawer hidden">
      <div id="drawer-content"></div>
    </div>
    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="modal" class="modal hidden">
      <div id="modal-content"></div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <div id="loading-overlay" class="loading-overlay hidden">
      <div id="loading-content" class="loading-content"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
